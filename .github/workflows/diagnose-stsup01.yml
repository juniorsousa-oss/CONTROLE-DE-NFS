name: Diagnosticar formato STSUP01

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_nf_date_format.py'
      - '.github/workflows/diagnose-stsup01.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências mínimas
        run: pip install pandas requests openpyxl
      - name: Inspecionar tipos e posições sem revelar dados fiscais
        run: python -m scripts.diagnose_nf_date_format
