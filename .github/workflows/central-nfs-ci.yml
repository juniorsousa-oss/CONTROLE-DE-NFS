name: Validar Central Controle de NFs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Compilar TODOS os fontes Python
        run: python -m compileall -q .
      - name: Auditar TODOS os arquivos e pontos de custo
        run: python -m scripts.audit_quality
      - name: Testar índice MRP contra pré-notas
        run: python -m scripts.test_nf_mrp_index
      - name: Testar catálogo de fornecedores por código e loja
        run: python -m scripts.test_nf_supplier_index
      - name: Testar transição explícita para busca na etapa 2
        run: python -m scripts.test_nf_stage2_explicit_lookup
      - name: Testar biblioteca XML privada
        run: python -m compileall -q nf_xml_library.py && python -m scripts.test_nf_xml_library
      - name: Testar pré-conferência e carga incremental dos XMLs
        run: python -m scripts.test_nf_xml_incremental
      - name: Testar fornecedor TOTVS e fallback XML seguro
        run: python -m scripts.test_nf_supplier_xml_fallback
      - name: Testar autorização da API XML implantada
        run: python -m scripts.smoke_nf_xml_api
      - name: Testar Dashboard ao abrir o menu SETTA
        run: python -m scripts.test_dashboard_sidebar_filters
      - name: Testar navegação e recuperação entre computadores
        run: python -m scripts.test_nf_navigation_recovery
      - name: Testar fluxo das NFs de 08/10
        run: python scripts/test_nf_flow_real_0810.py
      - name: Validar integração
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("streamlit_app.py").read_text(encoding="utf-8")
          central = Path("central_nfs_data.py").read_text(encoding="utf-8")
          shell = Path("setta_shell.py").read_text(encoding="utf-8")
          assert "def _sync_central_nfs_sources" in app
          assert "setta_shell.render_shell(" in app
          assert 'key="setta_drawer_toggle"' in app
          assert 'key=f"setta_nav_{_nav_index}"' in app
          assert "_setta_close_sidebar()" in app
          assert "SETTA UI — Layout padrão Streamlit" in shell
          assert "width:260px!important" in shell
          assert "max-width:none!important" in shell
          assert app.count("set_page_config(") == 1
          assert 'style id="nfs-component-style"' in app
          assert "height:8px!important" not in app
          assert ".st-key-setta_nav_0" in shell
          for forbidden in [
              'section[data-testid="stSidebar"]',
              '.block-container{',
              '[data-testid="stHeader"]',
              '[data-testid="stToolbar"]',
              '[data-testid="stAppViewContainer"]',
              'sidebar-nav-gap-fixed',
              'sidebar-status-gap-fixed',
              'sidebar-section-gap',
              'max-width:1780px!important',
          ]:
              assert forbidden not in app, f"CSS estrutural legado voltou ao app: {forbidden}"
          assert "SETTA UI — App Shell Rounded V1" not in shell
          assert 'section[data-testid="stSidebar"][aria-expanded="false"]{{width:0' not in shell
          assert "if sidebar_open:" in shell
          assert "display:flex!important" in shell
          assert "visibility:visible!important" in shell
          assert "opacity:1!important" in shell
          assert '"mes_pre_notas"' in app
          assert '"nf"' in app
          assert 'CONTINGÊNCIA MANUAL' in app
          assert '01 · FONTES' in app
          assert 'consumer_sync_status' in central
          assert 'visual_get' in central
          print("CENTRAL_NFS_OK")
          PY

      - name: Publicar auditoria do repositório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-audit
          path: .ci_reports/maintenance_audit.json
          if-no-files-found: warn
          retention-days: 14
